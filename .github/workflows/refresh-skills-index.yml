name: Refresh Skills Index

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */12 * * *"
  push:
    branches: [main]
    paths:
      - "scripts/build_index.py"
      - ".github/workflows/refresh-skills-index.yml"

permissions:
  contents: write

concurrency:
  group: refresh-skills-index
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build static repository index
        env:
          GITHUB_TOKEN: ${{ secrets.SKILLS_INDEX_TOKEN || github.token }}
          SKILLS_INDEX_QUERY: "topic:agent-skills"
          SKILLS_INDEX_MAX_REPOSITORIES: "200"
        run: python scripts/build_index.py --output data/skills-index.json
      - name: Commit refreshed data
        run: |
          if git diff --quiet -- data; then
            echo "Index is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "chore: refresh skills index"
          git push
